[package]
name = "bossnet-copilot"
version = "0.1.0"
description = "Bossnet real-time sales copilot"
authors = ["Bossnet"]
edition = "2021"

[lib]
name = "bossnet_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
url = "2"
anyhow = "1"
bytes = "1"
log = "0.4"
env_logger = "0.11"

# Audio
cpal = "0.15"
hound = "3.5"  # WAV writer
earshot = "0.1"  # pure-Rust port of WebRTC VAD (no C deps)

# Encoding: WebM/Opus not trivial in pure Rust. We ship raw 16kHz mono WAV
# per utterance (whisper accepts .wav directly). Small overhead but simplest.

[target."cfg(target_os = \"windows\")".dependencies]
# WASAPI loopback via cpal >= 0.15 supports LOOPBACK on Windows by opening
# an output device as input. No extra crate needed for MVP.

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
